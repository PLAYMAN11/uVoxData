<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2F77E2">
    <title>Sin conexión — OrientaVox</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #F8FAFC;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            text-align: center;
        }
        .icon {
            width: 80px;
            height: 80px;
            background: #EEF2FF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        h1 { font-size: 22px; font-weight: 800; color: #1E293B; margin-bottom: 10px; }
        p { font-size: 15px; color: #64748B; line-height: 1.6; max-width: 300px; margin: 0 auto 32px; }
        button {
            background: #2F77E2;
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 14px 32px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="icon">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
            <path d="M6 18a12 12 0 0 1 24 0" stroke="#2F77E2" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M2 18h4M30 18h4" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
            <circle cx="18" cy="28" r="3" fill="#2F77E2"/>
            <path d="M18 22v3" stroke="#2F77E2" stroke-width="2" stroke-linecap="round"/>
        </svg>
    </div>
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento. Revisa tu conexión e intenta de nuevo.</p>
    <button onclick="window.location.reload()">Reintentar</button>
</body>
</html>
